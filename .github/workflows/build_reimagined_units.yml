name: Build reimagined units
# build_reimagined_units.yml
# Builds and tests the C++20 units under modernized/rathena-reimagined/ (superbuild)
# on every toolchain the legacy servers support.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    paths:
      - 'modernized/**'
      - '.github/workflows/build_reimagined_units.yml'
  pull_request:
    paths:
      - 'modernized/**'
      - '.github/workflows/build_reimagined_units.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            werror: 'ON'
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            werror: 'ON'
          - name: windows-msvc
            os: windows-2022
            werror: 'OFF'
          - name: macos-clang
            os: macos-14
            werror: 'OFF'

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S modernized/rathena-reimagined -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATHENA_REIMAGINED_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 4

  # Live-database tests (persistence unit) against throwaway database service containers.
  # Both servers matter: M0 fingerprints must match on MariaDB and on MySQL 8.
  database-integration:
    name: linux-gcc-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql8
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 --silent
    env:
      # Per-run throwaway credential for the service container below; not a real secret.
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # The mariadb image accepts the MYSQL_* names too.
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: rathena_it
          MYSQL_USER: rathena_it
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB client library
        run: sudo apt-get update -q && sudo apt-get install -y -q libmariadb-dev

      - name: Configure
        run: >
          cmake -S modernized/rathena-reimagined -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATHENA_REIMAGINED_WERROR=ON
          -DRATHENA_PERSISTENCE_WITH_MYSQL=ON

      - name: Build
        run: cmake --build build --parallel 4 --target rathena_persistence_tests

      - name: Test (live database, serial)
        env:
          RATHENA_TEST_DATABASE_URL: mysql://rathena_it:${{ env.TEST_DB_PASSWORD }}@127.0.0.1:3306/rathena_it
        run: ctest --test-dir build --output-on-failure -R 'Mysql'
