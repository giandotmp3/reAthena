name: Build reimagined units
# build_reimagined_units.yml
# Builds and tests the C++20 units under modernized/rathena-reimagined/ (superbuild)
# on every toolchain the legacy servers support.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    paths:
      - 'modernized/**'
      - 'sql-files/**'
      - 'tools/sql/**'
      # Inputs of tools/codegen/battle_knobs.py (core/.../battle_knobs.gen.hpp)
      - 'tools/codegen/**'
      - 'src/map/battle.cpp'
      - 'src/custom/battle_config_init.inc'
      - 'src/config/core.hpp'
      - 'src/common/mmo.hpp'
      - 'src/map/path.hpp'
      - 'src/map/map.hpp'
      - 'src/map/mob.hpp'
      - 'src/map/skill.hpp'
      - 'src/map/status.hpp'
      - 'conf/battle_athena.conf'
      - 'conf/battle/**'
      - '.github/workflows/build_reimagined_units.yml'
  pull_request:
    paths:
      - 'modernized/**'
      - 'sql-files/**'
      - 'tools/sql/**'
      # Inputs of tools/codegen/battle_knobs.py (core/.../battle_knobs.gen.hpp)
      - 'tools/codegen/**'
      - 'src/map/battle.cpp'
      - 'src/custom/battle_config_init.inc'
      - 'src/config/core.hpp'
      - 'src/common/mmo.hpp'
      - 'src/map/path.hpp'
      - 'src/map/map.hpp'
      - 'src/map/mob.hpp'
      - 'src/map/skill.hpp'
      - 'src/map/status.hpp'
      - 'conf/battle_athena.conf'
      - 'conf/battle/**'
      - '.github/workflows/build_reimagined_units.yml'

permissions:
  contents: read

jobs:
  # The typed battle knob table is generated from legacy battle_data[] and conf/battle; fail fast
  # when it is stale (the core unit's ctest runs the same check where Python 3.10+ is found).
  codegen:
    name: generated-battle-knobs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check core/include/rathena/core/battle_knobs.gen.hpp is up to date
        run: python3 tools/codegen/battle_knobs.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            werror: 'ON'
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            werror: 'ON'
          - name: windows-msvc
            os: windows-2022
            werror: 'ON'
          - name: macos-clang
            os: macos-14
            werror: 'ON'

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S modernized/rathena-reimagined -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATHENA_REIMAGINED_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 4

  # Persistence tests against a throwaway PostgreSQL 16 service container, created like a real
  # rAthena database (SQL_ASCII, C locale: text is stored byte for byte). Each test works in its
  # own schema, so they run in parallel.
  postgresql:
    name: linux-gcc-postgresql
    runs-on: ubuntu-24.04
    env:
      # Per-run throwaway credential for the service container below; not a real secret.
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rathena_it
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: rathena_it
          POSTGRES_INITDB_ARGS: --encoding=SQL_ASCII --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rathena_it -d rathena_it"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Install libpq
        run: sudo apt-get update -q && sudo apt-get install -y -q libpq-dev

      - name: Configure
        run: >
          cmake -S modernized/rathena-reimagined -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATHENA_REIMAGINED_WERROR=ON
          -DRATHENA_PERSISTENCE_WITH_POSTGRESQL=ON

      - name: Build
        run: cmake --build build --parallel 4 --target rathena_persistence_tests

      - name: Test (persistence on PostgreSQL)
        env:
          RATHENA_TEST_PG_URL: postgresql://rathena_it:${{ env.TEST_DB_PASSWORD }}@127.0.0.1:5432/rathena_it
        run: |
          ctest --test-dir build/persistence --output-on-failure --parallel 4 | tee ctest.log
          # Every PostgreSQL-parameterized test must have run, not skipped.
          if grep -E '(postgresql|PostgresLive).*\(Skipped\)' ctest.log; then
            echo "PostgreSQL tests were skipped"; exit 1
          fi

  # One-time importer: a legacy MariaDB database (upstream sql-files/main.sql + logs.sql + seeded
  # rows with raw latin1 bytes, a zero date and an invalid enum) copied by `rathena-migrate import`
  # into PostgreSQL and into SQLite, then checked byte for byte.
  importer:
    name: linux-gcc-import-mariadb
    runs-on: ubuntu-24.04
    env:
      # Per-run throwaway credentials for the service containers below; not real secrets.
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: rathena_src
          MARIADB_USER: rathena_src
          MARIADB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rathena
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: ragnarok
          POSTGRES_INITDB_ARGS: --encoding=SQL_ASCII --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rathena -d ragnarok"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Install client libraries and tools
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q libmariadb-dev libpq-dev mariadb-client postgresql-client sqlite3

      - name: Configure
        run: >
          cmake -S modernized/rathena-reimagined -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATHENA_REIMAGINED_WERROR=ON
          -DRATHENA_PERSISTENCE_WITH_POSTGRESQL=ON
          -DRATHENA_MIGRATE_WITH_MYSQL=ON

      - name: Build rathena-migrate
        run: cmake --build build --parallel 4 --target rathena_migrate

      - name: Load the legacy MariaDB database
        env:
          MYSQL_PWD: ${{ env.TEST_DB_PASSWORD }}
        run: |
          db() { mariadb --host=127.0.0.1 --user=rathena_src --default-character-set=latin1 rathena_src "$@"; }
          # Legacy servers wrote raw client bytes into latin1 tables.
          db -e "ALTER DATABASE rathena_src CHARACTER SET latin1"
          db < sql-files/main.sql
          db < sql-files/logs.sql
          db < modernized/rathena-reimagined/persistence/tests/fixtures/import_seed.sql

      - name: Import into PostgreSQL
        env:
          SRC_URL: mysql://rathena_src:${{ env.TEST_DB_PASSWORD }}@127.0.0.1:3306/rathena_src
          DST_URL: postgresql://rathena:${{ env.TEST_DB_PASSWORD }}@127.0.0.1:5432/ragnarok
        run: |
          build/persistence/rathena-migrate import --from env:SRC_URL --to env:DST_URL
          # A second import into the now filled database must be refused.
          if build/persistence/rathena-migrate import --from env:SRC_URL --to env:DST_URL; then
            echo "second import was not refused"; exit 1
          fi

      - name: Check the PostgreSQL copy
        env:
          PGHOST: 127.0.0.1
          PGUSER: rathena
          PGDATABASE: ragnarok
          PGPASSWORD: ${{ env.TEST_DB_PASSWORD }}
        run: bash modernized/rathena-reimagined/persistence/tests/fixtures/check_import.sh postgresql

      - name: Import into SQLite and check
        env:
          SRC_URL: mysql://rathena_src:${{ env.TEST_DB_PASSWORD }}@127.0.0.1:3306/rathena_src
        run: |
          build/persistence/rathena-migrate import --from env:SRC_URL --to "sqlite:$RUNNER_TEMP/ragnarok.db"
          bash modernized/rathena-reimagined/persistence/tests/fixtures/check_import.sh sqlite "$RUNNER_TEMP/ragnarok.db"
