// Athena InterServer configuration.
// Contains settings shared/used by more than 1 server.

// Options for both versions

// Log Inter Connections, etc.?
log_inter: 1

// Inter Log Filename
inter_log_filename: log/inter.log

// Level range for sharing within a party
party_share_level: 15

// Amount of status points a new character will start with
start_status_points: 48

// Do we allow to change guild emblem during woe_time?
emblem_woe_change: yes

// How many transparent pixel can be found in emblem before detected as invalid? (Note 2)
emblem_transparency_limit: 80

// ----------------------------------------------------------------------------------------------
// Database
// ----------------------------------------------------------------------------------------------
// rAthena stores its data in SQLite or PostgreSQL. MySQL/MariaDB is no longer supported; to move an
// existing MySQL database see doc/database.md (rathena-migrate import).
//
// db_backend:
//   sqlite      Embedded database, nothing to install. The data lives in files under
//               sqlite_directory (one file per *_db name below, e.g. save/ragnarok.db).
//               Good for local development and single-machine servers.
//   postgresql  PostgreSQL 16+ server. Use it for production and when servers run on several
//               machines. The *_ip/_port/_id/_pw/_db settings below are its connection settings.
db_backend: sqlite
sqlite_directory: save

// Create the tables automatically when a server finds an empty database (yes/no).
// The schema files are read from db_schema_directory/<backend>/.
db_auto_create_schema: yes
db_schema_directory: sql-files

// Client encoding for PostgreSQL connections (e.g. utf8, latin1, euckr, cp949, gbk, big5, sjis).
// Create the database with ENCODING 'SQL_ASCII' to store client text byte-for-byte, as the
// MySQL latin1 tables did (see doc/database.md). Ignored for SQLite, which stores bytes as given.
//default_codepage:

// Login server database
login_server_ip: 127.0.0.1
login_server_port: 5432
login_server_id: ragnarok
login_server_pw: ragnarok
login_server_db: ragnarok
login_codepage:
login_case_sensitive: no

ipban_db_ip: 127.0.0.1
ipban_db_port: 5432
ipban_db_id: ragnarok
ipban_db_pw: ragnarok
ipban_db_db: ragnarok
ipban_codepage:

// Character server database
char_server_ip: 127.0.0.1
char_server_port: 5432
char_server_id: ragnarok
char_server_pw: ragnarok
char_server_db: ragnarok

// Map Server database
map_server_ip: 127.0.0.1
map_server_port: 5432
map_server_id: ragnarok
map_server_pw: ragnarok
map_server_db: ragnarok

// Web Server database
web_server_ip: 127.0.0.1
web_server_port: 5432
web_server_id: ragnarok
web_server_pw: ragnarok
web_server_db: ragnarok

// Log Database database
log_db_ip: 127.0.0.1
log_db_port: 5432
log_db_id: ragnarok
log_db_pw: ragnarok
log_db_db: ragnarok
log_codepage:
log_login_db: loginlog

// Reconnect settings (PostgreSQL)
// - db_reconnect_type:
//   1: When the database disconnects during runtime, the server tries to reconnect
//      db_reconnect_count times and shuts down if unsuccessful.
//   2: When the database disconnects during runtime, it tries to reconnect indefinitely.
db_reconnect_type: 2
db_reconnect_count: 1

// DO NOT CHANGE ANYTHING BEYOND THIS LINE UNLESS YOU KNOW YOUR DATABASE DAMN WELL
// this is meant for people who KNOW their stuff, and for some reason want to change their
