// Inter-server and database credentials (S1, BR-INTER-016).
// Secret keys may ONLY hold ${VAR} placeholders; a literal value is refused at startup.
// Startup also refuses known shipped-default values and weak values in these variables.

userid: ${INTER_SERVER_USER}
passwd: ${INTER_SERVER_PASS}

login_db_url: ${LOGIN_DB_URL}
char_db_url: ${CHAR_DB_URL}
map_db_url: ${MAP_DB_URL}
web_db_url: ${WEB_DB_URL}
log_db_url: ${LOG_DB_URL}

// Operator overlay (optional; missing file is a warning).
import: import/inter_server.conf
