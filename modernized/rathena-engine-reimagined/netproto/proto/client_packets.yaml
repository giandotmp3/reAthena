# Machine-readable client packet spec: the SEMANTIC layer over the legacy packet DB.
#
# Opcodes, lengths, handler offsets and struct fields below are NOT hand-typed truth.
# They are copied from proto/legacy_20211103.yaml (generated by tools/legacy/extract_packets.py
# from src/map/clif_packetdb.hpp + clif_shuffle.hpp + the typed structs) and re-checked on every
# test run by `netproto_codegen.py --verify-legacy`, which fails on any difference. What this file
# adds is what the legacy tables do not have: a stable semantic name, direction, category and
# the session-phase gate.
#
# One name may have several `versions`; `applies` is a predicate over (flavour, date):
# "MAIN>=X || RE>=Y", optionally "MAIN>=X && MAIN<Y". Every version below applies to exactly
# one verified target (date..date+1) because only that (date, flavour) has been evaluated.
# An entry that applies to no verified target is rejected by --verify-legacy.
#
# gate: pre_session | pre_map_load | in_world   (session-phase gating)
# length: {fixed: N} | {variable: {prefix_offset: 2, header: 4}}   (legacy len -1 = variable)
# fields: a list (taken from a typed legacy struct, offsets from the start of the packet, the
#   leading opcode and length members omitted) or the word `unknown` for handler-parsed packets;
#   no field types are guessed. For those, `handler_offsets` is the legacy pos[] list.
# legacy_handler: the clif_parse_* handler registered for this opcode in the legacy table.
# also_accepted_by_legacy: other opcodes the legacy table also routes to the same handler at
#   this target (older layers of the cumulative #if PACKETVER blocks). The model has one
#   opcode per (name, version), so these are NOT accepted here (secure default: unknown
#   opcode disconnects); the list is verified data for a later alias decision.
#
# Targets:
#   re/20211103    what a stock build selects: src/config/packets.hpp defines PACKETVER_RE for
#                  PACKETVER 20200902..20211118, so the default PACKETVER 20211103 is the RE client.
#   main/20211103  HYPOTHETICAL: no legacy build can select it (the RE auto-select cannot be
#                  turned off); evaluated by forcing the main flavour macros. Kept because the
#                  scaffold's first client id was main/20211103. They differ in one packet
#                  (WantToConnection 23 vs 19 bytes) plus 4 opcodes that exist only in RE.
# No credentials appear in this file; obfuscation keys are per-version data
# supplied at deploy time (obfuscation.keys_env), never literals.
schema: 1
client_versions:
  - { id: "re/20211103", flavour: re, date: 20211103, obfuscation: { keys_env: NETPROTO_KEYS_RE_20211103 } }
  - { id: "main/20211103", flavour: main, date: 20211103, hypothetical: true, obfuscation: { keys_env: NETPROTO_KEYS_MAIN_20211103 } }
packets:
  - name: CA_LOGIN            # a login-server packet; the map packet DB only lists its length
    direction: cz             # client to server
    category: login
    gate: pre_session
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x0064
        length: { fixed: 55 }
        handler_offsets: []
        fields: unknown
  - name: CZ_ENTER            # WantToConnection; legacy doc comment names 0x0436 CZ_ENTER2
    direction: cz
    category: connect
    gate: pre_session
    legacy_handler: clif_parse_WantToConnection
    versions:
      - applies: "RE>=20211103 && RE<20211104"
        opcode: 0x0436
        length: { fixed: 23 }
        handler_offsets: [2, 6, 10, 14, 22]
        fields: unknown
        also_accepted_by_legacy: [0x009b, 0x086a, 0x0888, 0x094b]
      - applies: "MAIN>=20211103 && MAIN<20211104"
        opcode: 0x0436
        length: { fixed: 19 }
        handler_offsets: [2, 6, 10, 14, 18]
        fields: unknown
        also_accepted_by_legacy: [0x009b, 0x086a, 0x0888, 0x094b]
  - name: CZ_NOTIFY_ACTORINIT       # LoadEndAck: load-end ack
    direction: cz
    category: connect
    gate: pre_map_load
    legacy_handler: clif_parse_LoadEndAck
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x007d
        length: { fixed: 2 }
        handler_offsets: []
        fields: unknown
  - name: CZ_REQUEST_MOVE           # WalkToXY; legacy doc comment names 0x035f CZ_REQUEST_MOVE2
    direction: cz
    category: movement
    gate: in_world
    legacy_handler: clif_parse_WalkToXY
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x035f
        length: { fixed: 5 }
        handler_offsets: [2]
        fields: unknown
        also_accepted_by_legacy: [0x00a7, 0x0881, 0x0953]
  - name: CZ_REQUEST_TIME           # TickSend, the client heartbeat (there is no separate ping)
    direction: cz
    category: session
    gate: in_world
    legacy_handler: clif_parse_TickSend
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x0360
        length: { fixed: 6 }
        handler_offsets: [2]
        fields: unknown
        also_accepted_by_legacy: [0x0089, 0x0887]
  - name: CZ_REQUEST_CHAT           # GlobalMessage, variable length
    direction: cz
    category: chat
    gate: in_world
    legacy_handler: clif_parse_GlobalMessage
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x00f3
        length: { variable: { prefix_offset: 2, header: 4 } }
        handler_offsets: [2, 4]
        fields: unknown
  - name: CZ_CONTACTNPC            # typed struct PACKET_CZ_CONTACTNPC
    direction: cz
    category: npc
    gate: in_world
    legacy_handler: clif_parse_NpcClicked
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x0090
        length: { fixed: 7 }
        handler_offsets: []
        fields:
          - { name: AID, offset: 2, type: u32 }
          - { name: type, offset: 6, type: u8 }
  - name: ZC_NOTIFY_PLAYERMOVE     # typed struct only; packet_db does not list server writers
    direction: zc
    category: movement
    gate: in_world
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x0087
        length: { fixed: 12 }
        fields:
          - { name: moveStartTime, offset: 2, type: u32 }
          - { name: moveData, offset: 6, type: u8, array_len: 6 }
  - name: ZC_NOTIFY_TIME           # typed struct only; reply to CZ_REQUEST_TIME
    direction: zc
    category: session
    gate: in_world
    versions:
      - applies: "RE>=20211103 && RE<20211104 || MAIN>=20211103 && MAIN<20211104"
        opcode: 0x007f
        length: { fixed: 6 }
        fields:
          - { name: time, offset: 2, type: u32 }
